name: CI/CD Pipeline for FastAPI App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 設置權限，確保可以讀取內容、寫入 Issue 和推送到 Packages (GHCR)
permissions:
  contents: read
  issues: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =================================================================
      # 步驟 1: 本地服務啟動與健康檢查 (模擬環境)
      # =================================================================
      - name: Build and Start Services via Docker Compose
        run: |
          # 構建並啟動服務
          docker compose up -d --build
          echo "等待容器內的 FastAPI 啟動..."
          # 設置等待循環，直到服務在根路徑返回 'ok'
          for i in {1..10}; do
            if curl -s http://localhost:8000/ | grep -q "ok"; then
              echo "FastAPI 容器已成功上線！"
              exit 0
            fi
            sleep 2
          done
          echo "錯誤：容器啟動超時，查看容器日誌："
          docker compose logs
          exit 1

      # =================================================================
      # 步驟 2: API 測試 (使用 Newman)
      # =================================================================
      - name: Setup Node.js and Install Newman
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Newman and Run Tests
        run: |
          npm install -g newman
          # 執行 Postman Collection 進行 API 測試
          newman run postman_collection.json

      # =================================================================
      # 步驟 3: 安全掃描 (OWASP ZAP Baseline Scan)
      # =================================================================
      - name: OWASP ZAP Baseline Scan
        run: |
          # 創建報告目錄
          mkdir -p zap_reports
          # 運行 ZAP 掃描，使用 --network=host 確保能訪問本地服務
          # 注意：這裡使用 || true 確保即使掃描失敗，CI 流程也不會中止
          docker run --user root -v $GITHUB_WORKSPACE/zap_reports:/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8000 -J report_json.json -w report_md.md -r report_html.html || true

      # =================================================================
      # 步驟 4: 上傳掃描報告
      # =================================================================
      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-scan-reports
          path: zap_reports/

      # =================================================================
      # 步驟 5: 鏡像推送 (僅在 main 分支觸發)
      # =================================================================
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastapi-devops-app:latest
            ghcr.io/${{ github.repository_owner }}/fastapi-devops-app:${{ github.sha }}