name: CI/CD Pipeline for FastAPI App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 設置權限，確保可以讀取內容、寫入問題和推送鏡像
permissions:
  contents: read
  issues: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: production # 假設有 production 環境
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =================================================================
      # 階段 1: 本地服務啟動與功能測試 (Docker Compose)
      # =================================================================
      - name: Build and Start Services via Docker Compose
        run: |
          # 啟動服務，並在背景運行
          docker compose up -d --build
          echo "等待容器內的 FastAPI 啟動..."
          # 設置等待循環，直到服務在 8000 端口響應到 'ok'
          for i in {1..10}; do
            if curl -s http://localhost:8000 | grep -q "ok"; then
              echo "FastAPI 容器已成功上線！"
              break
            fi
            sleep 2
          done
          if [ $i -ne 10 ]; then
            echo "FastAPI 容器已成功上線！"
          else
            echo "錯誤：容器啟動超時，查看容器日誌："
            docker compose logs
            exit 1
          fi

      # =================================================================
      # 階段 2: API 測試 (Newman/Postman)
      # =================================================================
      - name: Setup Node.js and Install Newman
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Newman and Run Tests
        run: |
          npm install -g newman
          # 運行 Postman Collection 進行 API 驗證
          newman run postman_collection.json

      # =================================================================
      # 階段 3: 安全掃描 (OWASP ZAP)
      # =================================================================
      - name: OWASP ZAP Baseline Scan
        run: |
          # 創建報告目錄
          mkdir -p zap_reports
          # 執行 ZAP 掃描，將結果寫入本地目錄
          # 注意：使用 --network=host 確保 ZAP 可以訪問本地服務
          docker run --user root -v $GITHUB_WORKSPACE/zap_reports:/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8000 -J report_json.json -w report_md.md -r report_html.html || true

      # =================================================================
      # 階段 4: 上傳報告
      # =================================================================
      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-scan-reports
          path: zap_reports/

      # =================================================================
      # 階段 5: 鏡像推送 (僅在 main 分支觸發)
      # =================================================================
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastapi-devops-app:latest
            ghcr.io/${{ github.repository_owner }}/fastapi-devops-app:${{ github.sha }}